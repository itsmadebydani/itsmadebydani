<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="It's Made by Dani. Built to ship.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080A12"/>
      <stop offset="1" stop-color="#0A1426"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#33A8FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#33A8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5BB8FF"/>
      <stop offset="1" stop-color="#0066FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- logo mark -->
  <rect x="80" y="70" width="44" height="44" rx="11" fill="#33A8FF"/>
  <path d="M105 79 L92 96 H101 L98 108 L112 90 H103 Z" fill="#080A12"/>
  <text x="138" y="100" font-family="Sora, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#E5E7EB">It's Made by <tspan font-weight="700" fill="#FFFFFF">Dani</tspan></text>

  <text x="80" y="200" font-family="Sora, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#FFFFFF" letter-spacing="-3">Built to <tspan fill="url(#accent)">ship.</tspan></text>

  <text x="82" y="252" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#9CA3AF">I design, build, and ship real software end to end,</text>
  <text x="82" y="284" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#33A8FF">then teach developers how to ship their own<tspan>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>_</tspan></text>

  <!-- floating dots -->
  <g fill="#33A8FF">
    <circle cx="1090" cy="90" r="4" opacity="0.8"><animate attributeName="cy" values="90;76;90" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1170" cy="170" r="3" opacity="0.5"><animate attributeName="cy" values="170;184;170" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="240" r="5" opacity="0.35"><animate attributeName="cy" values="240;228;240" dur="6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
